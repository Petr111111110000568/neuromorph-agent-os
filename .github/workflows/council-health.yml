name: Council cloud health

on:
  schedule:
    - cron: '52 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: council-cloud-health
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.repository == 'Petr111111110000568/neuromorph-agent-os' &&
      github.event.repository.private == false && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Trusted observer from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          path: trusted
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Read ledger checkout only as data
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: autonomy/continuous
          path: ledger
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Record health without provider calls or repair actions
        if: always()
        run: >-
          env -i PATH="$PATH" LANG=C.UTF-8
          python3 -I trusted/scripts/council_health.py
          --trusted trusted --ledger ledger --output runtime/council-health
      - name: Preserve morning report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: council-health-${{ github.run_id }}
          path: runtime/council-health/
          if-no-files-found: error
          retention-days: 14

