name: M02 bounded CPU experiment

on:
  push:
    branches: [autonomy/m02-cpu-coupled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m02-cpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      manifest_sha256: ${{ steps.seed.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Focused CPU contract and recovery tests
        run: python3 -m unittest discover -s tests -p 'test_m02_cpu.py' -v
      - name: Compute three bounded controls and stop after durable Queue.finish
        id: seed
        run: >-
          env -i PATH="$PATH" LANG=C.UTF-8
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID"
          GITHUB_SHA="$GITHUB_SHA" GITHUB_REF_NAME="$GITHUB_REF_NAME"
          GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT"
          GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" GITHUB_OUTPUT="$GITHUB_OUTPUT"
          python3 scripts/verify_m02_cpu.py seed --state runtime/cpu-state --output runtime/cpu-checkpoint
      - name: Save quiescent checkpoint for this run only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m02-cpu-checkpoint-${{ github.run_id }}
          path: runtime/cpu-checkpoint/
          if-no-files-found: error
          retention-days: 14
  resume:
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      EXPECTED_MANIFEST_SHA: ${{ needs.seed.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Restore only checkpoint from dependency in this exact workflow run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: m02-cpu-checkpoint-${{ github.run_id }}
          path: runtime/incoming
      - name: Verify hashes, recover without recomputation, compare controls
        run: >-
          env -i PATH="$PATH" LANG=C.UTF-8
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_RUN_ID="$GITHUB_RUN_ID"
          GITHUB_SHA="$GITHUB_SHA" GITHUB_REF_NAME="$GITHUB_REF_NAME"
          GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT"
          GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" EXPECTED_MANIFEST_SHA="$EXPECTED_MANIFEST_SHA"
          python3 scripts/verify_m02_cpu.py resume --state runtime/restored --incoming runtime/incoming --output runtime/cpu-result
      - name: Save real finite CPU results and recovery receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m02-cpu-result-${{ github.run_id }}
          path: runtime/cpu-result/
          if-no-files-found: error
          retention-days: 14
