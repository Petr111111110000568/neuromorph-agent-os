name: Core checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, resolved 2026-09-24
        with:
          persist-credentials: false
      - name: Unit and integration tests (no provider credentials)
        run: python3 -m unittest discover -s tests -v
      - name: Builtin integrity and environment checks
        run: python3 -m workbench doctor
      - name: Browser bridge policy and concurrency checks (no browser or model calls)
        run: |
          node --test browser-extension/policy.test.mjs browser-extension/bridge.test.mjs browser-extension/frontend.test.mjs
          node --check browser-extension/background.js
          node --check web/assistants.js
          node --check web/studio.js
      - name: Verify peer plugin profile bootstrap without model calls
        run: |
          env -i PATH="$PATH" LANG=C.UTF-8 python3 -m workbench.autonomy.plugin_coordination bootstrap
          env -i PATH="$PATH" LANG=C.UTF-8 python3 -m workbench.autonomy.plugin_coordination bootstrap

